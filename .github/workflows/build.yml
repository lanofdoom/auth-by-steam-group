name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux_x86_32
            os: ubuntu-latest
            platform: "@rules_sourcemod//platforms:linux_x86_32"
          - name: linux_x86_64
            os: ubuntu-latest
            platform: "@rules_sourcemod//platforms:linux_x86_64"
          - name: windows_x86_32
            os: windows-latest
            platform: "@rules_sourcemod//platforms:windows_x86_32"
          - name: windows_x86_64
            os: windows-latest
            platform: "@rules_sourcemod//platforms:windows_x86_64"

    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ matrix.name }}
          repository-cache: true

      - run: bazel build -c opt --platforms=${{ matrix.platform }} //...

      - uses: actions/upload-artifact@v4
        with:
          name: auth_by_steam_group_${{ matrix.name }}
          path: bazel-bin/auth_by_steam_group.tar.gz
